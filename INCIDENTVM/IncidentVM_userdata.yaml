#cloud-config

hostname: attackervm
manage_etc_hosts: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: $6$qTDYvGhBFYXcEuz.$k1DP25NmlgMNIQLbDGCQh8k3zNDLyrdVJ/99ojc3ir5xNjGxvB736GWNHA0LszFPYdIpD4W6Jxhz45ql6LpmM0
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK9gExgup4UNA3vRiCBKdCK9+IdVKbosvXEDpTrjqGVW shared-admin-key

ssh_pwauth: true

chpasswd:
  expire: false


# ============================================================
# PACKAGES
# ============================================================

packages:
  - ca-certificates
  - curl
  - wget
  - git
  - jq
  - zip
  - unzip
  - python3
  - python3-pip
  - python3-venv
  - python3-flask
  - nmap
  - smbclient
  - netcat-openbsd
  - tcpdump
  - dnsutils
  - net-tools
  - openssh-client
  - qemu-guest-agent
  - sshpass


# ============================================================
# SYSTEMD SERVICE
# ============================================================

write_files:

  - path: /etc/systemd/system/nordic-incident-web.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Nordic Manufacturing Incident Control Web GUI
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=simple

      User=ubuntu
      Group=ubuntu

      WorkingDirectory=/opt/nordic-attack/web

      ExecStart=/usr/bin/python3 /opt/nordic-attack/web/app.py

      Restart=on-failure
      RestartSec=5

      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target


# ============================================================
# INSTALLATION
# ============================================================

runcmd:

  # ----------------------------------------------------------
  # Installation log
  # ----------------------------------------------------------

  - touch /var/log/nordic-incident-install.log

  - echo "==============================================" >> /var/log/nordic-incident-install.log
  - echo "Nordic IncidentVM installation starting" >> /var/log/nordic-incident-install.log
  - date >> /var/log/nordic-incident-install.log
  - echo "==============================================" >> /var/log/nordic-incident-install.log


  # ----------------------------------------------------------
  # System update
  # ----------------------------------------------------------

  - apt-get update


  # ----------------------------------------------------------
  # QEMU Guest Agent
  # ----------------------------------------------------------

  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent


  # ==========================================================
  # DIRECTORY STRUCTURE
  # ==========================================================

  - mkdir -p /opt/nordic-attack

  - mkdir -p /opt/nordic-attack/scripts

  - mkdir -p /opt/nordic-attack/scenarios

  - mkdir -p /opt/nordic-attack/logs

  - mkdir -p /opt/nordic-attack/uploads

  - mkdir -p /opt/nordic-attack/data

  - mkdir -p /opt/nordic-attack/web

  - mkdir -p /opt/nordic-attack/web/templates

  - mkdir -p /opt/nordic-attack/web/static


  # ==========================================================
  # ATTACK ENGINE
  #
  # GitHub:
  # TESTFILES/ATTACKER/
  # ==========================================================


  # ----------------------------------------------------------
  # attackctl
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/attackctl https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/attackctl


  # ----------------------------------------------------------
  # 01 - Recon
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/scripts/01-recon.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/scripts/01-recon.sh


  # ----------------------------------------------------------
  # 02 - Web
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/scripts/02-web.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/scripts/02-web.sh


  # ----------------------------------------------------------
  # 03 - Authentication / Initial Access
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/scripts/03-auth.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/scripts/03-auth.sh


  # ----------------------------------------------------------
  # 04 - Internal Discovery / Lateral Movement
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/scripts/04-lateral.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/scripts/04-lateral.sh


  # ----------------------------------------------------------
  # 05 - Data Staging
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/scripts/05-staging.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/scripts/05-staging.sh


  # ----------------------------------------------------------
  # 06 - Exfiltration
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/scripts/06-exfil.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/scripts/06-exfil.sh


  # ----------------------------------------------------------
  # 07 - Ransomware simulation
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/scripts/07-ransomware-sim.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/scripts/07-ransomware-sim.sh


  # ----------------------------------------------------------
  # Exfiltration receiver
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/sink.py https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/sink.py


  # ----------------------------------------------------------
  # Full H3 Incident
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/scenarios/full-incident-h3.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER/scenarios/full-incident-h3.sh


  # ==========================================================
  # INCIDENTVM WEB GUI
  #
  # GitHub:
  # INCIDENTVM/web/
  # ==========================================================


  # ----------------------------------------------------------
  # Flask application
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/web/app.py https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INCIDENTVM/web/app.py


  # ----------------------------------------------------------
  # HTML template
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/web/templates/index.html https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INCIDENTVM/web/templates/index.html


  # ----------------------------------------------------------
  # CSS
  # ----------------------------------------------------------

  - wget -O /opt/nordic-attack/web/static/style.css https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INCIDENTVM/web/static/style.css


  # ==========================================================
  # VERIFY DOWNLOADED FILES
  # ==========================================================

  - test -s /opt/nordic-attack/attackctl

  - test -s /opt/nordic-attack/scripts/01-recon.sh

  - test -s /opt/nordic-attack/scripts/02-web.sh

  - test -s /opt/nordic-attack/scripts/03-auth.sh

  - test -s /opt/nordic-attack/scripts/04-lateral.sh

  - test -s /opt/nordic-attack/scripts/05-staging.sh

  - test -s /opt/nordic-attack/scripts/06-exfil.sh

  - test -s /opt/nordic-attack/scripts/07-ransomware-sim.sh

  - test -s /opt/nordic-attack/sink.py

  - test -s /opt/nordic-attack/scenarios/full-incident-h3.sh

  - test -s /opt/nordic-attack/web/app.py

  - test -s /opt/nordic-attack/web/templates/index.html

  - test -s /opt/nordic-attack/web/static/style.css


  # ==========================================================
  # FIX WINDOWS CRLF
  # ==========================================================

  - sed -i 's/\r$//' /opt/nordic-attack/attackctl

  - sed -i 's/\r$//' /opt/nordic-attack/scripts/*.sh

  - sed -i 's/\r$//' /opt/nordic-attack/scenarios/*.sh


  # ==========================================================
  # PERMISSIONS
  # ==========================================================

  - chmod 755 /opt/nordic-attack/attackctl

  - chmod 755 /opt/nordic-attack/scripts/*.sh

  - chmod 755 /opt/nordic-attack/scenarios/*.sh

  - chmod 644 /opt/nordic-attack/sink.py

  - chmod 644 /opt/nordic-attack/web/app.py

  - chmod 644 /opt/nordic-attack/web/templates/index.html

  - chmod 644 /opt/nordic-attack/web/static/style.css

  - chown -R ubuntu:ubuntu /opt/nordic-attack


  # ==========================================================
  # CLI COMMAND
  # ==========================================================

  - ln -sf /opt/nordic-attack/attackctl /usr/local/bin/attackctl


  # ==========================================================
  # VERIFY PYTHON / FLASK APPLICATION
  # ==========================================================

  - /usr/bin/python3 -m py_compile /opt/nordic-attack/web/app.py


  # ==========================================================
  # SYSTEMD WEB GUI
  # ==========================================================

  - systemctl daemon-reload

  - systemctl enable nordic-incident-web.service

  - systemctl start nordic-incident-web.service


  # ----------------------------------------------------------
  # Give Flask a moment to start
  # ----------------------------------------------------------

  - sleep 3


  # ==========================================================
  # INSTALLATION MARKER
  # ==========================================================

  - echo "Nordic IncidentVM installation completed" > /opt/nordic-attack/INSTALL_COMPLETE

  - date >> /opt/nordic-attack/INSTALL_COMPLETE

  - echo "" >> /opt/nordic-attack/INSTALL_COMPLETE

  - echo "CLI:" >> /opt/nordic-attack/INSTALL_COMPLETE

  - echo "/usr/local/bin/attackctl" >> /opt/nordic-attack/INSTALL_COMPLETE

  - echo "" >> /opt/nordic-attack/INSTALL_COMPLETE

  - echo "WEB GUI:" >> /opt/nordic-attack/INSTALL_COMPLETE

  - echo "TCP/8080" >> /opt/nordic-attack/INSTALL_COMPLETE

  - echo "" >> /opt/nordic-attack/INSTALL_COMPLETE


  # ==========================================================
  # VERIFY WEB SERVICE
  # ==========================================================

  - echo "=== WEB SERVICE ===" >> /opt/nordic-attack/INSTALL_COMPLETE

  - systemctl is-enabled nordic-incident-web.service >> /opt/nordic-attack/INSTALL_COMPLETE 2>&1 || true

  - systemctl is-active nordic-incident-web.service >> /opt/nordic-attack/INSTALL_COMPLETE 2>&1 || true

  - echo "" >> /opt/nordic-attack/INSTALL_COMPLETE


  # ==========================================================
  # VERIFY TCP 8080
  # ==========================================================

  - echo "=== TCP 8080 ===" >> /opt/nordic-attack/INSTALL_COMPLETE

  - ss -lntp | grep ':8080' >> /opt/nordic-attack/INSTALL_COMPLETE 2>&1 || true

  - echo "" >> /opt/nordic-attack/INSTALL_COMPLETE


  # ==========================================================
  # VERIFY LOCAL WEB API
  # ==========================================================

  - echo "=== WEB API HEALTH ===" >> /opt/nordic-attack/INSTALL_COMPLETE

  - curl --max-time 5 -s http://127.0.0.1:8080/api/health >> /opt/nordic-attack/INSTALL_COMPLETE 2>&1 || true

  - echo "" >> /opt/nordic-attack/INSTALL_COMPLETE


  # ==========================================================
  # INSTALLATION LOG
  # ==========================================================

  - echo "==============================================" >> /var/log/nordic-incident-install.log

  - echo "Nordic IncidentVM installation completed" >> /var/log/nordic-incident-install.log

  - date >> /var/log/nordic-incident-install.log

  - systemctl --no-pager status nordic-incident-web.service >> /var/log/nordic-incident-install.log 2>&1 || true

  - echo "==============================================" >> /var/log/nordic-incident-install.log


# ============================================================
# POWER OFF AFTER CLOUD-INIT
# ============================================================

power_state:
  mode: poweroff
  message: "Nordic IncidentVM cloud-init completed - powering off"
  timeout: 30
  condition: true