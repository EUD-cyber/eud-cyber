map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# Cyberlab HTTPS frontend
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cyberlab.crt;
    ssl_certificate_key /etc/nginx/certs/cyberlab.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html;
    index index.html;

    client_max_body_size 1g;

    proxy_buffering off;
    proxy_request_buffering off;

    # Portainer without trailing slash
    location = /portainer {
        return 301 /portainer/;
    }

    # Portainer reverse proxy
    location ^~ /portainer/ {
        proxy_pass https://portainer:9443/;
        proxy_http_version 1.1;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix /portainer;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect ~^/(.*)$ /portainer/$1;

        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Guacamole without trailing slash
    location = /guacamole {
        return 301 /guacamole/;
    }

    # Guacamole reverse proxy
    location ^~ /guacamole/ {
        proxy_pass http://guacamole:8080/guacamole/;
        proxy_http_version 1.1;

        proxy_set_header X-Remote-User "guacadmin";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /api/ {
        proxy_pass http://topology-api:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cyberlab static frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
