#cloud-config

hostname: mrnobody
manage_etc_hosts: true


# ============================================================
# USER
# ============================================================

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false

    # Samme password-hash som eksisterende IncidentVM
    passwd: $6$qTDYvGhBFYXcEuz.$k1DP25NmlgMNIQLbDGCQh8k3zNDLyrdVJ/99ojc3ir5xNjGxvB736GWNHA0LszFPYdIpD4W6Jxhz45ql6LpmM0

    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK9gExgup4UNA3vRiCBKdCK9+IdVKbosvXEDpTrjqGVW shared-admin-key


ssh_pwauth: true


chpasswd:
  expire: false


# ============================================================
# PACKAGES
# ============================================================

packages:
  - ca-certificates
  - curl
  - wget
  - jq
  - zip
  - unzip

  - python3
  - python3-pip
  - python3-venv
  - python3-flask

  - nginx
  - openssl

  - nmap
  - smbclient
  - netcat-openbsd
  - tcpdump
  - dnsutils
  - net-tools

  - openssh-client
  - sshpass

  - qemu-guest-agent


# ============================================================
# INSTALLER
# ============================================================

write_files:

  - path: /usr/local/sbin/install-nordic-incident-v2
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash

      set -Eeuo pipefail

      # ======================================================
      # CONFIGURATION
      # ======================================================

      BASE_URL="https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/TESTFILES/ATTACKER-V2"
      INSTALL_DIR="/opt/nordic-attack"
      LOG_FILE="/var/log/nordic-incident-install.log"
      TLS_DIR="/etc/nordic-incident/tls"
      CERT_FILE="${TLS_DIR}/incident.crt"
      KEY_FILE="${TLS_DIR}/incident.key"


      # ======================================================
      # LOGGING
      # ======================================================

      exec > >(tee -a "$LOG_FILE") 2>&1

