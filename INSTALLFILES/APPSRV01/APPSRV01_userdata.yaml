#cloud-config

hostname: appsrv01
manage_etc_hosts: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: $6$qTDYvGhBFYXcEuz.$k1DP25NmlgMNIQLbDGCQh8k3zNDLyrdVJ/99ojc3ir5xNjGxvB736GWNHA0LszFPYdIpD4W6Jxhz45ql6LpmM0

ssh_pwauth: true
chpasswd:
  expire: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - docker.io
  - qemu-guest-agent

runcmd:
  - apt-get update
  - apt-get install -y docker-compose-v2 
  - systemctl enable docker
  - systemctl start docker
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  - usermod -aG docker ubuntu
  - mkdir -p /opt/suricata
  - wget -O /opt/suricata/docker-compose.yml https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/SURICATA/docker-compose.yml
  - mkdir -p /opt/suricata/suricata
  - wget -O /opt/suricata/suricata/suricata.yaml https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/SURICATA/suricata/suricata.yaml
  - wget -O /opt/suricata/suricata/suricata.rules https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/SURICATA/suricata/suricata.rules
  - mkdir -p /opt/radius
  - mkdir -p /opt/radius/freeradius
  - mkdir -p /opt/radius/freeradius/mods-enabled
  - mkdir -p /opt/radius/freeradius/sites-enabled
  - mkdir -p /opt/radius/ldap
  - wget -O /opt/radius/docker-compose.yml https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/RADIUS/docker-compose.yml
  - wget -O /opt/radius/freeradius/clients.conf https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/RADIUS/freeradius/clients.conf
  - wget -O /opt/radius/freeradius/mods-enabled/ldap https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/RADIUS/freeradius/mods-enabled/ldap
  - wget -O /opt/radius/freeradius/sites-enabled/default https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/RADIUS/freeradius/sites-enabled/default
  - wget -O /opt/radius/ldap/01-ou.ldif https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/RADIUS/ldap/01-ou.ldif
  - wget -O /opt/radius/ldap/02-users.ldif https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/DOCKERFILES/RADIUS/ldap/02-users.ldif
  - chown -R ubuntu:ubuntu /opt
  - docker compose -f /opt/suricata/docker-compose.yml pull
  - docker compose -f /opt/radius/docker-compose.yml pull


power_state:
  mode: poweroff
  message: "Cloud-init finished - powering off"
  timeout: 30
  condition: True
