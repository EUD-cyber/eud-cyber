#cloud-config

hostname: tpot01
manage_etc_hosts: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: $6$qTDYvGhBFYXcEuz.$k1DP25NmlgMNIQLbDGCQh8k3zNDLyrdVJ/99ojc3ir5xNjGxvB736GWNHA0LszFPYdIpD4W6Jxhz45ql6LpmM0

ssh_pwauth: true
chpasswd:
  expire: false
  
packages:
  - git
  - curl
  - wget
  - ca-certificates

write_files:
  - path: /usr/local/sbin/tpot-terminal-compat
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      set -euo pipefail
      # Official systemd opt-out: remove shell hook and mask its tmpfiles rule.
      # Do not change PAM, login/session management, TERM or other prompt hooks.
      install -d -m 755 /etc/tmpfiles.d
      ln -sfn /dev/null /etc/tmpfiles.d/20-systemd-osc-context.conf
      hook=/etc/profile.d/80-systemd-osc-context.sh
      if [[ -L "$hook" ]]; then
        rm -- "$hook"
      elif [[ -f "$hook" ]]; then
        # Preserve a directly installed hook rather than deleting package data.
        mv -- "$hook" "${hook}.tpot-disabled"
      fi
  - path: /usr/local/bin/tpot-install.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      set -Eeuo pipefail
      umask 077
      LOG="/var/log/tpot-install.log"
      STATUS="/var/log/tpot-install-status.log"
      exec > >(tee -a "$LOG") 2>&1
      echo "starting" > "$STATUS"
      trap 'rc=$?; echo failed > "$STATUS"; echo "T-Pot failed at line $LINENO (exit $rc)"; exit "$rc"' ERR
      /usr/local/sbin/tpot-terminal-compat

      # =========================
      # VARIABLES (EDIT THESE)
      # =========================
      TPOT_TYPE="h"              # h = hive
      TPOT_USER="admin"
      install -d -m 700 /root/tpot01
      if [[ ! -s /root/tpot01/web-password ]]; then
        openssl rand -base64 32 > /root/tpot01/web-password
      fi
      TPOT_PASS="$(cat /root/tpot01/web-password)"
      TPOT_REF="9c3ae4aea976a63ef1f655598a4383c0cb7e140c"

      echo "===== TPOT INSTALL START $(date -Iseconds) ====="
      source /etc/os-release
      [[ "$ID" == ubuntu && "$VERSION_ID" == 26.04 ]]

      export DEBIAN_FRONTEND=noninteractive

      apt-get update
      apt-get install -y git curl wget ca-certificates

      cd /opt

      # Fetch an inspected Ubuntu 26.04 commit; preserve failures for diagnosis.
      if [[ ! -d /opt/tpotce ]]; then
        git init /opt/tpotce
        git -C /opt/tpotce remote add origin https://github.com/telekom-security/tpotce
        git -C /opt/tpotce fetch --depth 1 origin "$TPOT_REF"
        git -C /opt/tpotce checkout --detach FETCH_HEAD
      fi
      [[ "$(git -c safe.directory=/opt/tpotce -C /opt/tpotce rev-parse HEAD)" == "$TPOT_REF" ]]

      chown -R ubuntu:ubuntu /opt/tpotce

      echo "Running installer as ubuntu" | tee -a "$STATUS"

      # Upstream finds installer/install/tpot.yml relative to cwd. Running from
      # /opt attempts to download tpot.yml there as ubuntu and fails permission checks.
      cd /opt/tpotce
      # Upstream CLI requires -p. No tracing; installer output is root-only.
      sudo -H -u ubuntu env DEBIAN_FRONTEND=noninteractive bash ./install.sh -s -t "$TPOT_TYPE" -u "$TPOT_USER" -p "$TPOT_PASS" -b "$TPOT_REF"

      RC=$?
      echo "installer exit code: $RC" | tee -a "$STATUS"

      if [ "$RC" -eq 0 ]; then
        echo "success" > "$STATUS"
      else
        echo "failed" > "$STATUS"
      fi

      echo "===== TPOT INSTALL END $(date -Iseconds) ====="

      sync
      shutdown -h now

runcmd:
  - [ bash, /usr/local/bin/tpot-install.sh ]

final_message: "T-Pot install complete. Check logs in /var/log/"
