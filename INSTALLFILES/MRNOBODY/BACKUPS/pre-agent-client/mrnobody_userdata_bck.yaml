#cloud-config

hostname: mrnobody
manage_etc_hosts: true


# ============================================================
# USER
# ============================================================

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false

    # Samme password-hash som eksisterende IncidentVM
    passwd: $6$qTDYvGhBFYXcEuz.$k1DP25NmlgMNIQLbDGCQh8k3zNDLyrdVJ/99ojc3ir5xNjGxvB736GWNHA0LszFPYdIpD4W6Jxhz45ql6LpmM0


ssh_pwauth: true

chpasswd:
  expire: false


# ============================================================
# PACKAGES
# ============================================================

packages:
  - ca-certificates
  - curl
  - wget
  - jq
  - zip
  - unzip
  - python3
  - python3-pip
  - python3-venv
  - python3-flask
  - python3-reportlab
  - nginx
  - openssl
  - nmap
  - smbclient
  - netcat-openbsd
  - tcpdump
  - dnsutils
  - net-tools
  - openssh-client
  - sshpass
  - freerdp3-x11
  - qemu-guest-agent


# ============================================================
# INSTALLER
# ============================================================

write_files:

  # Deployment settings are read by the backend for status only.
  # Keep local configuration outside /opt/nordic-attack, which is rebuilt.
  - path: /etc/mrnobody/deployment.conf
    owner: root:root
    permissions: '0600'
    content: |
      MRNOBODY_ROLE="standalone"
      MRNOBODY_MASTER_URL=""

  - path: /usr/local/sbin/install-mrnobody
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash

      set -Eeuo pipefail


      # ======================================================
      # CONFIGURATION
      # ======================================================

      BASE_URL="https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/INSTALLFILES/TESTFILES/ATTACKER-V2"
      INSTALL_DIR="/opt/nordic-attack"
      LOG_FILE="/var/log/mrnobody-install.log"

      TLS_DIR="/etc/nordic-incident/tls"
      CERT_FILE="${TLS_DIR}/incident.crt"
      KEY_FILE="${TLS_DIR}/incident.key"


      # ======================================================
      # LOGGING
      # ======================================================

      exec > >(tee -a "$LOG_FILE") 2>&1

      log() {
          echo
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"
      }

      fail() {
          log "ERROR: $*"
          exit 1
      }


      # ======================================================
      # ERROR HANDLER
      # ======================================================

      trap '
          rc=$?
          echo
          echo "================================================"
          echo "INSTALLATION FAILED"
          echo "Exit code: $rc"
          echo "================================================"
          exit $rc
      ' ERR


      echo
      echo "================================================"
      echo " MrNobody Incident Platform"
      echo " Installation"
      echo "================================================"
      echo


      # ======================================================
      # STOP OLD SERVICE IF PRESENT
      # ======================================================

      log "Stopping existing Incident service..."

      systemctl stop nordic-incident-web.service \
          2>/dev/null || true


      # ======================================================
      # PREPARE INSTALL DIRECTORY
      # ======================================================

      log "Preparing ${INSTALL_DIR}..."

      rm -rf "$INSTALL_DIR"

      mkdir -p \
        "$INSTALL_DIR/config" \
        "$INSTALL_DIR/nginx" \
        "$INSTALL_DIR/scripts" \
        "$INSTALL_DIR/scenarios" \
        "$INSTALL_DIR/systemd" \
        "$INSTALL_DIR/logs" \
        "$INSTALL_DIR/state" \
        "$INSTALL_DIR/runtime" \
        "$INSTALL_DIR/reports" \
        "$INSTALL_DIR/uploads" \
        "$INSTALL_DIR/web/templates" \
        "$INSTALL_DIR/web/static"


      # ======================================================
      # DOWNLOAD DIRECTLY FROM GITHUB
      # ======================================================

      download_file() {
          local remote_path="$1"
          local destination="$2"

          log "Downloading: ${remote_path}"

          wget \
              --quiet \
              --show-progress \
              --timeout=20 \
              --tries=3 \
              -O "$destination" \
              "${BASE_URL}/${remote_path}"

          [[ -s "$destination" ]] || \
              fail "Downloaded file is empty or missing: ${remote_path}"
      }


      download_file \
          "web/p06_synthetic.py" \
          "$INSTALL_DIR/web/p06_synthetic.py"

      download_file \
          "web/exfil_validation.py" \
          "$INSTALL_DIR/web/exfil_validation.py"

      # ------------------------------------------------------
      # CONFIG
      # ------------------------------------------------------

      download_file \
          "config/defaults.conf" \
          "$INSTALL_DIR/config/defaults.conf"


      # ------------------------------------------------------
      # ATTACK PHASES
      # ------------------------------------------------------

      download_file \
          "scripts/01-discovery.sh" \
          "$INSTALL_DIR/scripts/01-discovery.sh"

      download_file \
          "scripts/02-web.sh" \
          "$INSTALL_DIR/scripts/02-web.sh"

      download_file \
          "scripts/03-access.sh" \
          "$INSTALL_DIR/scripts/03-access.sh"

      download_file \
          "scripts/04-lateral.sh" \
          "$INSTALL_DIR/scripts/04-lateral.sh"

      download_file \
          "scripts/05-staging.sh" \
          "$INSTALL_DIR/scripts/05-staging.sh"

      download_file \
          "scripts/06-exfil.sh" \
          "$INSTALL_DIR/scripts/06-exfil.sh"

      download_file \
          "scripts/07-impact.sh" \
          "$INSTALL_DIR/scripts/07-impact.sh"

      download_file \
          "scripts/08-wordlist.sh" \
          "$INSTALL_DIR/scripts/08-wordlist.sh"

      download_file \
          "scripts/09-ad-privilege.sh" \
          "$INSTALL_DIR/scripts/09-ad-privilege.sh"

      download_file \
          "scripts/10-powershell.sh" \
          "$INSTALL_DIR/scripts/10-powershell.sh"

      download_file \
          "scripts/11-persistence.sh" \
          "$INSTALL_DIR/scripts/11-persistence.sh"

      download_file \
          "scripts/update.sh" \
          "$INSTALL_DIR/scripts/update.sh"

      download_file \
          "scripts/mrnobody" \
          "$INSTALL_DIR/scripts/mrnobody"

      download_file \
        "scripts/run-phase.sh" \
        "$INSTALL_DIR/scripts/run-phase.sh"

      # ------------------------------------------------------
      # ORCHESTRATOR
      # ------------------------------------------------------

      download_file \
          "scenarios/full-incident.sh" \
          "$INSTALL_DIR/scenarios/full-incident.sh"


      # ------------------------------------------------------
      # WEB GUI
      # ------------------------------------------------------

      download_file \
          "web/access_pipeline.py" \
          "$INSTALL_DIR/web/access_pipeline.py"

      download_file \
          "web/windows_actions.py" \
          "$INSTALL_DIR/web/windows_actions.py"

      download_file \
        "web/p09_actions.py" \
        "$INSTALL_DIR/web/p09_actions.py"

      download_file \
          "web/unavailable.py" \
          "$INSTALL_DIR/web/unavailable.py"

      download_file \
          "web/retired_files.py" \
          "$INSTALL_DIR/web/retired_files.py"

      download_file \
          "web/remote_actions.py" \
          "$INSTALL_DIR/web/remote_actions.py"

      download_file \
          "web/ssh_actions.py" \
          "$INSTALL_DIR/web/ssh_actions.py"

      download_file \
          "web/persistence_actions.py" \
          "$INSTALL_DIR/web/persistence_actions.py"

      download_file \
          "web/p11_campaign.py" \
          "$INSTALL_DIR/web/p11_campaign.py"

      download_file \
          "web/linux_process.py" \
          "$INSTALL_DIR/web/linux_process.py"

      mkdir -p "$INSTALL_DIR/docs"
      download_file \
          "docs/p11-linux-standalone.md" \
          "$INSTALL_DIR/docs/p11-linux-standalone.md"

      download_file \
          "docs/p11-full-campaign.md" \
          "$INSTALL_DIR/docs/p11-full-campaign.md"

      download_file \
          "web/scenario_model.py" \
          "$INSTALL_DIR/web/scenario_model.py"

      download_file \
          "web/execution.py" \
          "$INSTALL_DIR/web/execution.py"

      download_file \
          "web/scheduler.py" \
          "$INSTALL_DIR/web/scheduler.py"

      download_file \
          "web/planning_api.py" \
          "$INSTALL_DIR/web/planning_api.py"

      download_file \
          "web/static/planning.js" \
          "$INSTALL_DIR/web/static/planning.js"

      download_file \
          "web/deployment_config.py" \
          "$INSTALL_DIR/web/deployment_config.py"

      download_file \
          "web/master_registry.py" \
          "$INSTALL_DIR/web/master_registry.py"

      download_file \
          "web/master_api.py" \
          "$INSTALL_DIR/web/master_api.py"

      download_file \
          "web/app.py" \
          "$INSTALL_DIR/web/app.py"

      download_file \
          "web/reports.py" \
          "$INSTALL_DIR/web/reports.py"
      download_file \
          "web/p04_evidence.py" \
          "$INSTALL_DIR/web/p04_evidence.py"

      download_file \
          "web/report_exports.py" \
          "$INSTALL_DIR/web/report_exports.py"

      download_file \
          "web/templates/index.html" \
          "$INSTALL_DIR/web/templates/index.html"

      download_file \
          "web/static/style.css" \
          "$INSTALL_DIR/web/static/style.css"

      download_file \
          "web/static/app.js" \
          "$INSTALL_DIR/web/static/app.js"


      # ------------------------------------------------------
      # NGINX
      # ------------------------------------------------------

      mkdir -p /etc/nginx/sites-available
      mkdir -p /etc/nginx/sites-enabled

      download_file \
        "nginx/nordic-incident.conf" \
        "$INSTALL_DIR/nginx/nordic-incident.conf"

      install -m 0644 \
        "$INSTALL_DIR/nginx/nordic-incident.conf" \
        /etc/nginx/sites-available/nordic-incident.conf


      # ------------------------------------------------------
      # SYSTEMD
      # ------------------------------------------------------

      download_file \
        "systemd/nordic-incident-web.service" \
        "$INSTALL_DIR/systemd/nordic-incident-web.service"

      install -m 0644 \
        "$INSTALL_DIR/systemd/nordic-incident-web.service" \
        /etc/systemd/system/nordic-incident-web.service


      # ======================================================
      # NORMALIZE WINDOWS LINE ENDINGS
      # ======================================================

      log "Normalizing line endings..."

      sed -i 's/\r$//' \
          "${INSTALL_DIR}/scripts/"*.sh

      sed -i 's/\r$//' \
          "${INSTALL_DIR}/scenarios/"*.sh

      sed -i 's/\r$//' \
          "${INSTALL_DIR}/config/defaults.conf"

      sed -i 's/\r$//' \
          "${INSTALL_DIR}/scripts/mrnobody"

      # ======================================================
      # PERMISSIONS
      # ======================================================

      log "Setting permissions..."

      chmod 755 \
          "${INSTALL_DIR}/scripts/"*.sh

      chmod 755 \
        "${INSTALL_DIR}/scripts/mrnobody"

      chmod 755 \
          "${INSTALL_DIR}/scenarios/"*.sh

      chmod 644 \
          "${INSTALL_DIR}/config/defaults.conf"

      chmod 644 \
          "${INSTALL_DIR}/web/app.py"

      chmod 644 \
          "${INSTALL_DIR}/web/reports.py"

      chmod 0644 "${INSTALL_DIR}/web/report_exports.py"

      chmod 644 \
          "${INSTALL_DIR}/web/templates/index.html"

      chmod 644 \
          "${INSTALL_DIR}/web/static/style.css"

      chmod 644 \
          "${INSTALL_DIR}/web/static/app.js"

      chmod 644 \
          /etc/nginx/sites-available/nordic-incident.conf

      chmod 644 \
          /etc/systemd/system/nordic-incident-web.service

      # ======================================================
      # PYTHON VENV / WINRM CLIENT
      # ======================================================

      log "Preparing Python virtual environment for WinRM..."

      python3 -m venv \
          "${INSTALL_DIR}/venv"

      "${INSTALL_DIR}/venv/bin/pip" \
          install \
          --upgrade pip

      "${INSTALL_DIR}/venv/bin/pip" \
          install \
          pywinrm \
          requests-ntlm

      log "Validating WinRM Python environment..."

      "${INSTALL_DIR}/venv/bin/python" - <<'PY'
      import winrm
      import requests_ntlm
      import spnego

      print("WinRM Python environment OK")
      print("winrm:", winrm.__file__)
      print("requests_ntlm:", requests_ntlm.__file__)
      print("spnego:", spnego.__file__)
      PY


      # ======================================================
      # PYTHON VALIDATION
      # ======================================================

      log "Validating Flask application..."

      /usr/bin/python3 \
          -m compileall -q \
          "${INSTALL_DIR}/web"


      # ======================================================
      # BASH VALIDATION
      # ======================================================

      log "Validating campaign scripts..."

      for script in \
          "${INSTALL_DIR}/scripts/"*.sh \
          "${INSTALL_DIR}/scenarios/"*.sh
      do
          echo "  Checking: $script"
          bash -n "$script"
      done

      echo "  Checking: ${INSTALL_DIR}/scripts/mrnobody"
      bash -n "${INSTALL_DIR}/scripts/mrnobody"

      install -m 0755 \
            "${INSTALL_DIR}/scripts/mrnobody" \
            /usr/local/bin/mrnobody

      # ======================================================
      # TLS
      # ======================================================

      log "Preparing HTTPS certificate..."

      mkdir -p "$TLS_DIR"

      chmod 700 "$TLS_DIR"

      if [[ ! -s "$CERT_FILE" || ! -s "$KEY_FILE" ]]; then

          log "Generating self-signed TLS certificate..."

          openssl req \
              -x509 \
              -nodes \
              -newkey rsa:3072 \
              -sha256 \
              -days 3650 \
              -keyout "$KEY_FILE" \
              -out "$CERT_FILE" \
              -subj "/C=DK/O=MrNobody Incident Platform/CN=incidentvm"

      else

          log "Existing TLS certificate retained."

      fi

      chmod 600 "$KEY_FILE"
      chmod 644 "$CERT_FILE"


      # ======================================================
      # NGINX
      # ======================================================

      log "Installing nginx configuration..."

      ln -sfn \
          /etc/nginx/sites-available/nordic-incident.conf \
          /etc/nginx/sites-enabled/nordic-incident.conf

      # Disable Ubuntu default nginx site
      rm -f \
          /etc/nginx/sites-enabled/default

      log "Testing nginx configuration..."

      nginx -t


      # ======================================================
      # SYSTEMD
      # ======================================================

      log "Installing systemd service..."

      systemctl daemon-reload


      # ======================================================
      # QEMU GUEST AGENT
      # ======================================================

      log "Starting QEMU Guest Agent..."

      systemctl enable qemu-guest-agent

      systemctl restart qemu-guest-agent || true


      # ======================================================
      # ENABLE SERVICES
      # ======================================================

      log "Enabling Incident Web service..."

      systemctl enable \
          nordic-incident-web.service

      log "Enabling nginx..."

      systemctl enable nginx


      # ======================================================
      # START FLASK
      # ======================================================

      log "Starting Flask backend..."

      systemctl restart \
          nordic-incident-web.service

      sleep 3


      # ======================================================
      # VERIFY FLASK
      # ======================================================

      log "Checking Flask API..."

      curl \
          --fail \
          --silent \
          --show-error \
          --max-time 10 \
          http://127.0.0.1:8082/api/health

      echo


      # ======================================================
      # START NGINX
      # ======================================================

      log "Starting nginx..."

      systemctl restart nginx

      sleep 2


      # ======================================================
      # VERIFY HTTPS
      # ======================================================

      log "Checking HTTPS frontend..."

      curl \
          --insecure \
          --fail \
          --silent \
          --show-error \
          --max-time 10 \
          https://127.0.0.1/api/health

      echo


      # ======================================================
      # VERIFY PORTS
      # ======================================================

      log "Checking listening ports..."

      ss -lntp | grep -E \
          ':(80|443|8082)[[:space:]]' \
          || true


      # ======================================================
      # VERIFY OOBM EXCLUSION
      # ======================================================

      log "Checking OOBM exclusion..."

      grep \
          'NORDIC_DISCOVERY_EXCLUDE_NETWORKS="172.20.0.0/24"' \
          "${INSTALL_DIR}/config/defaults.conf" \
          >/dev/null \
          || fail "OOBM exclusion missing from defaults.conf"


      # ======================================================
      # INSTALL MARKER
      # ======================================================

      log "Writing installation marker..."

      {
          echo "MrNobody Incident Platform"
          echo
          echo "Installation completed:"
          date
          echo

          echo "GitHub raw source:"
          echo "$BASE_URL"
          echo

          echo "Install directory:"
          echo "$INSTALL_DIR"
          echo

          echo "Web GUI:"
          echo "HTTPS TCP/443"
          echo

          echo "HTTP:"
          echo "TCP/80 -> HTTPS redirect"
          echo

          echo "Flask backend:"
          echo "127.0.0.1:8082"
          echo

          echo "OOBM excluded:"
          echo "172.20.0.0/24"
          echo

          echo "Service:"
          systemctl is-enabled \
              nordic-incident-web.service \
              2>&1 || true

          systemctl is-active \
              nordic-incident-web.service \
              2>&1 || true

          echo

          echo "nginx:"
          systemctl is-enabled nginx \
              2>&1 || true

          systemctl is-active nginx \
              2>&1 || true

          echo

          echo "Health:"
          curl \
              --insecure \
              --silent \
              --max-time 5 \
              https://127.0.0.1/api/health \
              2>&1 || true

      } > "${INSTALL_DIR}/INSTALL_COMPLETE"


      # ======================================================
      # COMPLETE
      # ======================================================

      echo
      echo "================================================"
      echo " INSTALLATION COMPLETE"
      echo "================================================"
      echo
      echo " Web GUI:"
      echo "   https://<IncidentVM-IP>/"
      echo
      echo " Flask:"
      echo "   127.0.0.1:8082"
      echo
      echo " Logs:"
      echo "   $LOG_FILE"
      echo
      echo "================================================"
      echo


# ============================================================
# CLOUD-INIT
# ============================================================

runcmd:

  # ----------------------------------------------------------
  # Installation log
  # ----------------------------------------------------------

  - touch /var/log/mrnobody-install.log

  - echo "==============================================" >> /var/log/mrnobody-install.log
  - echo "MrNobody Incident Platform cloud-init starting" >> /var/log/mrnobody-install.log
  - date >> /var/log/mrnobody-install.log
  - echo "==============================================" >> /var/log/mrnobody-install.log


  # ----------------------------------------------------------
  # Update package metadata
  # ----------------------------------------------------------

  - apt-get update


  # ----------------------------------------------------------
  # Run complete V2 installer
  # ----------------------------------------------------------

  - /usr/local/sbin/install-mrnobody


  # ----------------------------------------------------------
  # Final cloud-init marker
  # ----------------------------------------------------------

  - echo "" >> /var/log/mrnobody-install.log
  - echo "==============================================" >> /var/log/mrnobody-install.log
  - echo "MrNobody Incident Platform cloud-init completed" >> /var/log/mrnobody-install.log
  - date >> /var/log/mrnobody-install.log
  - echo "==============================================" >> /var/log/mrnobody-install.log


# ============================================================
# POWER OFF AFTER INSTALLATION
# ============================================================

power_state:
  mode: poweroff
  message: "MrNobody Incident Platform installation completed - powering off"
  timeout: 30
  condition: true
