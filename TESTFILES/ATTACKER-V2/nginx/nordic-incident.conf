# ============================================================
# Nordic Manufacturing A/S
# MrNobody Incident Platform
#
# nginx reverse proxy
#
# Browser
#    |
#    | HTTPS :443
#    v
# nginx
#    |
#    | HTTP 127.0.0.1:8082
#    v
# Flask
#
# HTTP :80 redirects to HTTPS.
# ============================================================

# MrNobody nginx update test
# ============================================================
# HTTP -> HTTPS
# ============================================================

server {

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 301 https://$host$request_uri;
}


# ============================================================
# HTTPS
# ============================================================

server {

    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;


    # ========================================================
    # TLS
    #
    # Certificate/key are generated locally by the installer.
    # The private key must NOT be stored in Git.
    # ========================================================

    ssl_certificate
        /etc/nordic-incident/tls/incident.crt;

    ssl_certificate_key
        /etc/nordic-incident/tls/incident.key;


    ssl_protocols
        TLSv1.2
        TLSv1.3;


    ssl_session_cache
        shared:NORDIC_SSL:10m;

    ssl_session_timeout
        10m;

    ssl_session_tickets
        off;


    # ========================================================
    # BASIC SECURITY HEADERS
    # ========================================================

    add_header
        X-Content-Type-Options
        "nosniff"
        always;

    add_header
        X-Frame-Options
        "SAMEORIGIN"
        always;

    add_header
        Referrer-Policy
        "no-referrer"
        always;


    # ========================================================
    # LOGGING
    # ========================================================

    access_log
        /var/log/nginx/nordic-incident-access.log;

    error_log
        /var/log/nginx/nordic-incident-error.log;


    # ========================================================
    # REVERSE PROXY
    # ========================================================

    location / {

        proxy_pass
            http://127.0.0.1:8082;

        proxy_http_version
            1.1;


        # ----------------------------------------------------
        # Forward original request information
        # ----------------------------------------------------

        proxy_set_header
            Host
            $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            https;


        # ----------------------------------------------------
        # Campaign requests should not be cached
        # ----------------------------------------------------

        proxy_buffering
            off;

        proxy_cache
            off;


        # ----------------------------------------------------
        # Timeouts
        #
        # Flask only starts/stops the background campaign.
        # The HTTP request itself should return quickly.
        # ----------------------------------------------------

        proxy_connect_timeout
            5s;

        proxy_send_timeout
            30s;

        proxy_read_timeout
            30s;
    }


    # ========================================================
    # OPTIONAL HEALTH ENDPOINT
    # ========================================================

    location = /api/health {

        proxy_pass
            http://127.0.0.1:8082/api/health;

        proxy_http_version
            1.1;

        proxy_set_header
            Host
            $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            https;

        access_log off;
    }
}