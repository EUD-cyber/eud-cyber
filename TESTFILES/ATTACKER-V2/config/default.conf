# ============================================================
# Nordic Manufacturing A/S
# H3 Incident Campaign V2
# Default Configuration
# ============================================================
#
# Default values for the dynamic H3 incident campaign.
# Values supplied by the Web GUI / campaign environment
# override these defaults.
#
# ============================================================


# ============================================================
# VERSION
# ============================================================

NORDIC_VERSION="2.0"
NORDIC_CAMPAIGN_NAME="H3 Incident Campaign V2"


# ============================================================
# INSTALLATION / PATHS
# ============================================================

NORDIC_BASE_DIR="/opt/nordic-attack"

NORDIC_SCRIPT_DIR="${NORDIC_BASE_DIR}/scripts"
NORDIC_SCENARIO_DIR="${NORDIC_BASE_DIR}/scenarios"
NORDIC_LOG_DIR="${NORDIC_BASE_DIR}/logs"
NORDIC_STATE_DIR="${NORDIC_BASE_DIR}/state"
NORDIC_UPLOAD_DIR="${NORDIC_BASE_DIR}/uploads"


# ============================================================
# NETWORK DISCOVERY
# ============================================================
#
# V2 automatically discovers networks directly connected
# to the IncidentVM.
#
# Only private RFC1918 networks are automatically allowed.
#
# Networks reachable only through the default route must
# NOT automatically become campaign targets.
#
# ============================================================

NORDIC_DISCOVERY_PRIVATE_ONLY="1"

# Interfaces ignored during automatic discovery.

NORDIC_DISCOVERY_IGNORE_INTERFACES="lo"

# Do not automatically scan networks larger than /16.

NORDIC_DISCOVERY_MIN_PREFIX="16"

# Maximum number of discovered hosts in one campaign.

NORDIC_MAX_DISCOVERED_HOSTS="254"


# ============================================================
# WEB / PROXY DISCOVERY
# ============================================================
#
# Phase 02 checks these ports by default.
#
# The GUI must display this default list.
# The teacher can add/remove ports before starting a campaign.
#
# Examples of additional ports:
#
#   3000
#   5000
#   8000
#   8888
#   9000
#
# ============================================================

NORDIC_DEFAULT_WEB_PORTS="80,443,3010,8080,8443"

# Maximum number of web/proxy ports entered through the GUI.

NORDIC_MAX_WEB_PORTS="32"


# ============================================================
# SSH / INITIAL ACCESS
# ============================================================
#
# Phase 03 only marks a host as COMPROMISED when:
#
#   1. SSH is available
#   2. Authentication succeeds using the credentials
#      supplied through the GUI
#
# ============================================================

NORDIC_DEFAULT_SSH_PORT="22"

NORDIC_DEFAULT_SSH_USER="ubuntu"

# Password intentionally has no default.
# It must be supplied through the GUI.

NORDIC_DEFAULT_SSH_PASSWORD=""


# ============================================================
# CONNECTION TIMEOUTS
# ============================================================

# General TCP/service detection timeout.

NORDIC_CONNECT_TIMEOUT="3"

# SSH connection timeout.

NORDIC_SSH_TIMEOUT="5"

# HTTP/HTTPS detection timeout.

NORDIC_HTTP_TIMEOUT="5"


# ============================================================
# CAMPAIGN TIMING
# ============================================================
#
# Small delays help create a readable incident timeline
# for SIEM/firewall investigation.
#
# ============================================================

NORDIC_PHASE_DELAY_MIN="2"
NORDIC_PHASE_DELAY_MAX="5"

NORDIC_HOST_DELAY_MIN="1"
NORDIC_HOST_DELAY_MAX="3"


# ============================================================
# WEB GUI
# ============================================================
#
# Flask only listens on localhost.
# nginx provides HTTPS access to the GUI.
#
# Browser:
#
#   HTTPS :443
#       |
#       v
#     nginx
#       |
#       v
#   Flask 127.0.0.1:8082
#
# ============================================================

NORDIC_WEB_HOST="127.0.0.1"
NORDIC_WEB_PORT="8082"

NORDIC_HTTPS_PORT="443"
NORDIC_HTTP_REDIRECT_PORT="80"


# ============================================================
# TLS / HTTPS
# ============================================================

NORDIC_TLS_DIR="/etc/nordic-incident/tls"

NORDIC_TLS_CERT="${NORDIC_TLS_DIR}/incident.crt"

NORDIC_TLS_KEY="${NORDIC_TLS_DIR}/incident.key"

# Self-signed certificate validity in days.

NORDIC_TLS_DAYS="3650"


# ============================================================
# CAMPAIGN STATE
# ============================================================
#
# V2 uses JSON state files to pass discovered information
# between the individual phases.
#
# ============================================================

NORDIC_NETWORK_STATE="${NORDIC_STATE_DIR}/networks.json"

NORDIC_DISCOVERED_STATE="${NORDIC_STATE_DIR}/discovered-hosts.json"

NORDIC_WEB_STATE="${NORDIC_STATE_DIR}/web-targets.json"

NORDIC_COMPROMISED_STATE="${NORDIC_STATE_DIR}/compromised-hosts.json"

NORDIC_CAMPAIGN_STATE="${NORDIC_STATE_DIR}/campaign.json"


# ============================================================
# LOGGING
# ============================================================

NORDIC_GROUND_TRUTH_LOG="${NORDIC_LOG_DIR}/incident-ground-truth.log"

NORDIC_CAMPAIGN_LOG="${NORDIC_LOG_DIR}/campaign.log"


# ============================================================
# LAB SAFETY / SCOPE
# ============================================================
#
# Dynamic discovery must stay inside the CyberLab.
#
# Only RFC1918 private IPv4 networks may be selected
# automatically.
#
# ============================================================

NORDIC_REQUIRE_PRIVATE_NETWORKS="1"

# Never automatically include a network reached only
# through the default route.

NORDIC_EXCLUDE_DEFAULT_ROUTE="1"