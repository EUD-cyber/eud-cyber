name: MrNobody - Build Update Manifest

on:
  push:
    branches:
      - main
    paths:
      - "TESTFILES/ATTACKER-V2/**"
      - ".github/workflows/mrnobody-manifest.yml"

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make manifest builder executable
        run: chmod +x TESTFILES/ATTACKER-V2/tools/build-manifest.sh

      - name: Build MrNobody update manifest
        run: TESTFILES/ATTACKER-V2/tools/build-manifest.sh

      
      - name: Commit updated manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TESTFILES/ATTACKER-V2/update-manifest.txt

          if git diff --cached --quiet; then
            echo "Manifest is already up to date."
          else
            git commit -m "Update MrNobody manifest"
            git push
          fi