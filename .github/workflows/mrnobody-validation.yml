name: MrNobody - Validate platform cleanup
on:
  pull_request:
    paths:
      - 'INSTALLFILES/TESTFILES/ATTACKER-V2/**'
      - 'INSTALLFILES/TESTFILES/ATTACKER/**'
      - 'INSTALLFILES/INCIDENTVM/**'
      - 'INSTALLFILES/MRNOBODY/**'
      - 'INSTALLFILES/tests/mrnobody/**'
      - '.github/workflows/mrnobody-validation.yml'
permissions:
  contents: read
defaults:
  run:
    working-directory: INSTALLFILES
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python, JavaScript and Bash syntax without executing campaigns
        run: |
          python -m compileall -q TESTFILES/ATTACKER-V2/web INCIDENTVM/web TESTFILES/ATTACKER/sink.py tests/mrnobody
          node --check TESTFILES/ATTACKER-V2/web/static/app.js
          node --check TESTFILES/ATTACKER-V2/web/static/planning.js
          node --check tests/mrnobody/ui_browser.cjs
          find TESTFILES/ATTACKER-V2 TESTFILES/ATTACKER MRNOBODY INCIDENTVM -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n TESTFILES/ATTACKER-V2/scripts/mrnobody
          bash -n TESTFILES/ATTACKER/attackctl
      - name: Install isolated export test dependencies
        run: python -m pip install 'reportlab>=4,<5' 'flask>=3,<4' 'pypdf>=5,<7' 'requests>=2,<3' 'PyYAML>=6,<7'
      - name: Verify secure agent pairing, registry and update repair without services or network
        run: |
          python tests/mrnobody/agent_client.py -v
          python tests/mrnobody/master_registry.py -v
          python tests/mrnobody/update_agent.py -v
          python tests/mrnobody/deployment_settings.py -v
      - name: Validate bootstrap WinRM venv and nginx/systemd configuration in isolation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          python - <<'PY'
          import os, pathlib, re, subprocess, tempfile, yaml
          root = pathlib.Path.cwd()
          config = yaml.safe_load((root / 'MRNOBODY/mrnobody_userdata.yaml').read_text())
          script = next(x['content'] for x in config['write_files'] if x['path'] == '/usr/local/sbin/install-mrnobody')
          with tempfile.TemporaryDirectory() as tmp:
              base = pathlib.Path(tmp)
              subprocess.run(['python', '-m', 'venv', str(base / 'venv')], check=True)
              commands = re.findall(r'"\$\{INSTALL_DIR\}/venv/bin/pip"\s*\\\s*\n\s*install\s*\\\s*\n\s*pywinrm\s*\\\s*\n\s*requests-ntlm', script)
              assert len(commands) == 1, 'Bootstrap WinRM dependency command drifted'
              subprocess.run([str(base / 'venv/bin/pip'), 'install', 'pywinrm', 'requests-ntlm'], check=True)
              subprocess.run([str(base / 'venv/bin/python'), '-c', 'import winrm, requests_ntlm, spnego, requests'], check=True)
              assert {'python3-flask', 'python3-reportlab', 'nginx', 'openssl', 'python3-venv'} <= set(config['packages'])
              subprocess.run(['openssl', 'req', '-x509', '-nodes', '-newkey', 'rsa:2048',
                              '-keyout', str(base / 'incident.key'), '-out', str(base / 'incident.crt'),
                              '-days', '1', '-subj', '/CN=localhost'], check=True, capture_output=True)
              site = (root / 'TESTFILES/ATTACKER-V2/nginx/nordic-incident.conf').read_text()
              site = site.replace('/etc/nordic-incident/tls/', str(base) + '/').replace('/var/log/nginx/', str(base) + '/')
              (base / 'site.conf').write_text(site)
              (base / 'nginx.conf').write_text('pid ' + str(base / 'nginx.pid') + ';\nerror_log ' + str(base / 'error.log') + ';\nevents {}\nhttp { include ' + str(base / 'site.conf') + '; }\n')
              subprocess.run(['sudo', 'nginx', '-t', '-c', str(base / 'nginx.conf')], check=True)
          subprocess.run(['systemd-analyze', 'verify', str(root / 'TESTFILES/ATTACKER-V2/systemd/nordic-incident-web.service')], check=True)
          print('Bootstrap dependency imports, nginx TLS configuration and systemd unit verification passed; no MrNobody service or campaign started.')
          PY
      - name: Verify distributed update manifest
        run: |
          bash TESTFILES/ATTACKER-V2/tools/build-manifest.sh
          git diff --exit-code -- TESTFILES/ATTACKER-V2/update-manifest.txt
      - name: Verify P06 standalone validation, dispatch and receiver evidence offline
        run: |
          python tests/mrnobody/p06_default.py -v
          python tests/mrnobody/p06_standalone.py -v
          python tests/mrnobody/p09_standalone.py -v
      - name: Verify paired P11 lifecycle, bounded DNS, API and report exports without network
        timeout-minutes: 3
        run: |
          python -u tests/mrnobody/persistence_dns.py -v
          python -u tests/mrnobody/p11_linux.py -v
          python tests/mrnobody/p11_windows.py -v
          python tests/mrnobody/p11_conflicts.py -v
          python tests/mrnobody/p11_campaign.py -v
      - name: Check routing, live output, incident IDs and historical compatibility with isolated fixtures
        run: |
          python tests/mrnobody/backend.py
          python tests/mrnobody/ui.py
          python tests/mrnobody/install.py
          python tests/mrnobody/phase_retirement.py
          python tests/mrnobody/full_incident.py
          python tests/mrnobody/release_validation.py
          python tests/mrnobody/scenario_presets.py
          python tests/mrnobody/scenario_portability.py
          python tests/mrnobody/planning.py --bash
          python tests/mrnobody/remote_actions.py
          python tests/mrnobody/native_dual.py
          node tests/mrnobody/dual_review.cjs
          python tests/mrnobody/windows_actions.py
          python tests/mrnobody/ad_prerequisite.py
          python tests/mrnobody/pipeline_contract.py -v
          python tests/mrnobody/p03_winrm.py -v
          python tests/mrnobody/p09_discovery.py -v
          python tests/mrnobody/p09_regression.py
          python tests/mrnobody/ad_enabled.py
          python tests/mrnobody/powershell_errors.py
          node tests/mrnobody/planning.cjs
          python tests/mrnobody/overview.py
          node tests/mrnobody/overview.cjs
          node tests/mrnobody/standalone_report.cjs
          node tests/mrnobody/standalone_ports.cjs
          python tests/mrnobody/standalone_ports.py -v
          python tests/mrnobody/reports.py --bash
          python tests/mrnobody/runtime.py --bash
          node tests/mrnobody/scenarios.cjs
          node tests/mrnobody/logs.cjs
          node tests/mrnobody/reports.cjs
          node tests/mrnobody/report_reveal.cjs
          python tests/mrnobody/staging_artifacts.py
          python tests/mrnobody/p04_evidence.py
          python tests/mrnobody/report_exports.py
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/mrn-ui" --no-save playwright@1.62.1
          "$RUNNER_TEMP/mrn-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify read-only UI and responsive layouts against real registry
        env:
          MRN_UI_ARTIFACTS: ${{ runner.temp }}/mrn-ui-screenshots
        run: |
          mkdir -p "$MRN_UI_ARTIFACTS"
          NODE_PATH="$RUNNER_TEMP/mrn-ui/node_modules" node tests/mrnobody/ui_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrnobody-ui-screenshots
          path: ${{ runner.temp }}/mrn-ui-screenshots
          if-no-files-found: ignore


  windows-persistence-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse P11 scripts and compile service without executing or installing it
        run: python tests/mrnobody/persistence_static.py
      - name: Verify P11 service WinRS framing and safe diagnostics offline
        run: python tests/mrnobody/p11_windows.py -v
      - name: Install isolated DNS test dependencies
        run: python -m pip install 'reportlab>=4,<5' 'flask>=3,<4' 'requests>=2,<3'
      - name: Verify P11 collision preflight and controlled skip reporting offline
        run: python tests/mrnobody/p11_conflicts.py -v
      - name: Verify P06 synthetic Windows script parsing and transport contracts offline
        run: python tests/mrnobody/p06_default.py -v
      - name: Verify P09 AD scripts, reconciliation and timeout recovery offline
        run: |
          python -m pip install 'pypdf>=5,<7' 'pywinrm>=0.4.3,<0.6'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/mrnobody/ad_enabled.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/mrnobody/pipeline_contract.py -v
          python tests/mrnobody/p03_winrm.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/mrnobody/p09_discovery.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/mrnobody/p09_regression.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/mrnobody/p09_standalone.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/mrnobody/p09_powershell.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
