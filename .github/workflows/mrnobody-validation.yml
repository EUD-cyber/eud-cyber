name: MrNobody - Validate platform cleanup
on:
  pull_request:
    paths:
      - 'TESTFILES/ATTACKER-V2/**'
      - 'TESTFILES/ATTACKER/**'
      - 'INCIDENTVM/**'
      - 'MRNOBODY/**'
      - 'tests/mrnobody/**'
      - '.github/workflows/mrnobody-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python, JavaScript and Bash syntax without executing campaigns
        run: |
          python -m compileall -q TESTFILES/ATTACKER-V2/web INCIDENTVM/web TESTFILES/ATTACKER/sink.py tests/mrnobody
          node --check TESTFILES/ATTACKER-V2/web/static/app.js
          node --check TESTFILES/ATTACKER-V2/web/static/planning.js
          find TESTFILES/ATTACKER-V2 TESTFILES/ATTACKER MRNOBODY INCIDENTVM -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n TESTFILES/ATTACKER-V2/scripts/mrnobody
          bash -n TESTFILES/ATTACKER/attackctl
      - name: Install isolated export test dependencies
        run: python -m pip install 'reportlab>=4,<5' 'flask>=3,<4' 'pypdf>=5,<7' 'requests>=2,<3' 'PyYAML>=6,<7'
      - name: Verify distributed update manifest
        run: |
          bash TESTFILES/ATTACKER-V2/tools/build-manifest.sh
          git diff --exit-code -- TESTFILES/ATTACKER-V2/update-manifest.txt
      - name: Check routing, live output, incident IDs and historical compatibility with isolated fixtures
        run: |
          python tests/mrnobody/backend.py
          python tests/mrnobody/install.py
          python tests/mrnobody/planning.py --bash
          python tests/mrnobody/remote_actions.py
          python tests/mrnobody/lab_phases.py
          python tests/mrnobody/application_collection.py
          python tests/mrnobody/native_dual.py
          node tests/mrnobody/dual_review.cjs
          python tests/mrnobody/windows_actions.py
          python tests/mrnobody/ad_prerequisite.py
          python tests/mrnobody/ad_enabled.py
          python tests/mrnobody/powershell_errors.py
          node tests/mrnobody/planning.cjs
          python tests/mrnobody/overview.py
          node tests/mrnobody/overview.cjs
          python tests/mrnobody/reports.py --bash
          python tests/mrnobody/runtime.py --bash
          node tests/mrnobody/scenarios.cjs
          node tests/mrnobody/logs.cjs
          node tests/mrnobody/reports.cjs
          python tests/mrnobody/report_exports.py


  windows-persistence-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse P11 scripts and compile service without executing or installing it
        run: python tests/mrnobody/persistence_static.py
