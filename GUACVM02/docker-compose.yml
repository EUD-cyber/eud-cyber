name: cyberlab-v2

networks:
  guacnetwork_compose:
    driver: bridge

services:
  guacd:
    container_name: cyberlab-guacd
    image: guacamole/guacd:1.6.0
    restart: always
    networks:
      - guacnetwork_compose
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw

  postgres:
    container_name: cyberlab-postgres
    image: postgres:16-alpine
    restart: always
    networks:
      - guacnetwork_compose
    environment:
      PGDATA: /var/lib/postgresql/data/guacamole
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: 'Password1!'
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - guacamole_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U guacamole_user -d guacamole_db
      interval: 5s
      timeout: 5s
      retries: 20

  guacamole:
    container_name: cyberlab-guacamole
    image: guacamole/guacamole:1.6.0
    restart: always
    depends_on:
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - guacnetwork_compose
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_USERNAME: guacamole_user
      POSTGRESQL_PASSWORD: 'Password1!'
      HTTP_AUTH_ENABLED: "true"
      HTTP_AUTH_HEADER: "X-Remote-User"
      RECORDING_SEARCH_PATH: /record
      REMOTE_IP_VALVE_ENABLED: "true"
    volumes:
      - ./record:/record:rw
    expose:
      - "8080"

  nginx:
    container_name: cyberlab-nginx
    image: nginx:alpine
    restart: always
    depends_on:
      - guacamole
    networks:
      - guacnetwork_compose
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/web:/var/www/html:ro

  portainer:
    image: portainer/portainer-ce:lts
    container_name: cyberlab-portainer
    restart: always

    command:
      - --no-csp
      - --base-url
      - /portainer
      - --admin-password-file
      - /run/secrets/portainer_admin_password

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./portainer-admin-password:/run/secrets/portainer_admin_password:ro

    networks:
      - guacnetwork_compose

    expose:
      - "9443"

volumes:
  guacamole_postgres_data:
    name: cyberlab-guacamole-postgres-data

  portainer_data:
    name: cyberlab-portainer-data
