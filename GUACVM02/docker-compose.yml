name: cyberlab-v2

networks:
  cyberlab:
    driver: bridge

services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: cyberlab-guacd
    restart: unless-stopped
    networks:
      - cyberlab
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw

  postgres:
    image: postgres:16-alpine
    container_name: cyberlab-postgres
    restart: unless-stopped
    networks:
      - cyberlab
    environment:
      PGDATA: /var/lib/postgresql/data/guacamole
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: cyberlab-guacamole
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - cyberlab
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      HTTP_AUTH_ENABLED: "true"
      HTTP_AUTH_HEADER: X-Remote-User
      RECORDING_SEARCH_PATH: /record
      REMOTE_IP_VALVE_ENABLED: "true"
    volumes:
      - ./record:/record:rw
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: cyberlab-nginx
    restart: unless-stopped
    depends_on:
      - guacamole
    networks:
      - cyberlab
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/web:/var/www/html:ro

volumes:
  postgres_data:
    name: cyberlab-postgres-data
