#cloud-config

hostname: guacvm
manage_etc_hosts: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: $6$qTDYvGhBFYXcEuz.$k1DP25NmlgMNIQLbDGCQh8k3zNDLyrdVJ/99ojc3ir5xNjGxvB736GWNHA0LszFPYdIpD4W6Jxhz45ql6LpmM0
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK9gExgup4UNA3vRiCBKdCK9+IdVKbosvXEDpTrjqGVW shared-admin-key

ssh_pwauth: true

chpasswd:
  expire: false

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - wget
  - docker.io
  - docker-compose-v2
  - qemu-guest-agent
  - gzip
  - iptables
  - iptables-persistent
  - netfilter-persistent
  - openssl

write_files:
  - path: /opt/guacamole/scripts/generate-https-certificate.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      INTERFACE="eth0"
      CERT_DIR="/opt/guacamole/nginx/certs"
      CERT_FILE="${CERT_DIR}/cyberlab.crt"
      KEY_FILE="${CERT_DIR}/cyberlab.key"
      CONFIG_FILE="${CERT_DIR}/openssl.cnf"

      log() {
        printf '[+] %s\n' "$*"
      }

      die() {
        printf '[ERROR] %s\n' "$*" >&2
        exit 1
      }

      # Vent på at eth0 får en IPv4-adresse
      SERVER_IP=""

      for attempt in $(seq 1 60); do
        SERVER_IP="$(
          ip -4 -o addr show dev "$INTERFACE" scope global 2>/dev/null |
          awk '{print $4}' |
          cut -d/ -f1 |
          head -n1
        )"

        if [[ -n "$SERVER_IP" ]]; then
          break
        fi

        log "Waiting for an IPv4 address on ${INTERFACE}..."
        sleep 2
      done

      [[ -n "$SERVER_IP" ]] ||
        die "No IPv4 address found on ${INTERFACE}."

      SERVER_HOSTNAME="$(hostname -s)"
      SERVER_FQDN="$(hostname -f 2>/dev/null || hostname -s)"

      mkdir -p "$CERT_DIR"

      log "Generating HTTPS certificate"
      log "Interface: ${INTERFACE}"
      log "IP address: ${SERVER_IP}"
      log "Hostname: ${SERVER_HOSTNAME}"
      log "FQDN: ${SERVER_FQDN}"

      cat > "$CONFIG_FILE" <<EOF
      [req]
      prompt = no
      default_bits = 4096
      default_md = sha256
      distinguished_name = dn
      x509_extensions = extensions

      [dn]
      C = DK
      O = Cyberlab
      OU = Training Lab
      CN = ${SERVER_HOSTNAME}

      [extensions]
      subjectAltName = @alt_names
      keyUsage = critical,digitalSignature,keyEncipherment
      extendedKeyUsage = serverAuth
      basicConstraints = critical,CA:FALSE

      [alt_names]
      DNS.1 = ${SERVER_HOSTNAME}
      DNS.2 = ${SERVER_FQDN}
      IP.1 = ${SERVER_IP}
      EOF

      openssl req \
        -x509 \
        -nodes \
        -days 3650 \
        -newkey rsa:4096 \
        -keyout "$KEY_FILE" \
        -out "$CERT_FILE" \
        -config "$CONFIG_FILE"

      chmod 600 "$KEY_FILE"
      chmod 644 "$CERT_FILE"
      chmod 600 "$CONFIG_FILE"

      log "Certificate generated successfully."

      openssl x509 \
        -in "$CERT_FILE" \
        -noout \
        -subject \
        -ext subjectAltName

  - path: /opt/guacamole/docker-compose.yml
    owner: root:root
    permissions: '0644'
    content: |
      name: cyberlab-v2

      networks:
        guacnetwork_compose:
          driver: bridge

      services:
        guacd:
          container_name: cyberlab-guacd
          image: guacamole/guacd:1.6.0
          restart: always
          networks:
            - guacnetwork_compose
          volumes:
            - ./drive:/drive:rw
            - ./record:/record:rw

        postgres:
          container_name: cyberlab-postgres
          image: postgres:16-alpine
          restart: always
          networks:
            - guacnetwork_compose
          environment:
            PGDATA: /var/lib/postgresql/data/guacamole
            POSTGRES_DB: guacamole_db
            POSTGRES_USER: guacamole_user
            POSTGRES_PASSWORD: 'Password1!'
          volumes:
            - ./init:/docker-entrypoint-initdb.d:ro
            - guacamole_postgres_data:/var/lib/postgresql/data
          healthcheck:
            test:
              - CMD-SHELL
              - pg_isready -U guacamole_user -d guacamole_db
            interval: 5s
            timeout: 5s
            retries: 20

        guacamole:
          container_name: cyberlab-guacamole
          image: guacamole/guacamole:1.6.0
          restart: always
          depends_on:
            guacd:
              condition: service_started
            postgres:
              condition: service_healthy
          networks:
            - guacnetwork_compose
          environment:
            GUACD_HOSTNAME: guacd
            POSTGRESQL_ENABLED: "true"
            POSTGRESQL_DATABASE: guacamole_db
            POSTGRESQL_HOSTNAME: postgres
            POSTGRESQL_USERNAME: guacamole_user
            POSTGRESQL_PASSWORD: 'Password1!'
            HTTP_AUTH_ENABLED: "true"
            HTTP_AUTH_HEADER: "X-Remote-User"
            RECORDING_SEARCH_PATH: /record
            REMOTE_IP_VALVE_ENABLED: "true"
          volumes:
            - ./record:/record:rw
          expose:
            - "8080"

        nginx:
          container_name: cyberlab-nginx
          image: nginx:alpine
          restart: always
          depends_on:
            - guacamole
          networks:
            - guacnetwork_compose
          ports:
            - "80:80"
          volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./nginx/web:/var/www/html:ro

      volumes:
        guacamole_postgres_data:
          name: cyberlab-guacamole-postgres-data

  - path: /opt/guacamole/nginx/nginx.conf
    owner: root:root
    permissions: '0644'
    content: |
      map $http_upgrade $connection_upgrade {
          default upgrade;
          ''      close;
      }

      server {
          listen 80;
          server_name _;

          root /var/www/html;
          index index.html;

          client_max_body_size 1g;
          proxy_buffering off;
          proxy_request_buffering off;

          location / {
              try_files $uri $uri/ /index.html;
          }

          location /guacamole/ {
              proxy_pass http://guacamole:8080/guacamole/;
              proxy_http_version 1.1;

              proxy_set_header X-Remote-User "guacadmin";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;

              proxy_connect_timeout 30s;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
          }
      }

  - path: /etc/systemd/system/guac-nat.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Cyberlab v2 Guacamole NAT
      After=network-online.target docker.service
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/opt/guacamole/nat.sh apply
      ExecReload=/opt/guacamole/nat.sh apply
      ExecStop=/opt/guacamole/nat.sh remove
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent

  - mkdir -p /opt/guacamole/init
  - mkdir -p /opt/guacamole/drive
  - mkdir -p /opt/guacamole/record
  - mkdir -p /opt/guacamole/backups
  - mkdir -p /opt/guacamole/scripts
  - mkdir -p /opt/guacamole/nginx/web/pages

  - chmod 777 /opt/guacamole/drive
  - chmod 777 /opt/guacamole/record
  - chmod 700 /opt/guacamole/backups

  # Frontend
  - wget -O /opt/guacamole/nginx/web/index.html https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/index.html
  - wget -O /opt/guacamole/nginx/web/style.css https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/style.css
  - wget -O /opt/guacamole/nginx/web/app.js https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/app.js
  - wget -O /opt/guacamole/nginx/web/sessions.js https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/sessions.js
  - wget -O /opt/guacamole/nginx/web/documentation.js https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/documentation.js

  # Pages
  - wget -O /opt/guacamole/nginx/web/pages/labs.html https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/pages/labs.html
  - wget -O /opt/guacamole/nginx/web/pages/documentation.html https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/pages/documentation.html
  - wget -O /opt/guacamole/nginx/web/pages/tools.html https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/pages/tools.html
  - wget -O /opt/guacamole/nginx/web/pages/settings.html https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nginx/web/pages/settings.html

  # Scripts
  - wget -O /opt/guacamole/scripts/backup-guacamole-db.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/scripts/backup-guacamole-db.sh
  - wget -O /opt/guacamole/scripts/restore-guacamole-db.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/scripts/restore-guacamole-db.sh
  - wget -O /opt/guacamole/nat.sh https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/nat.sh

  # Optional DB backup
  - wget -O /opt/guacamole/backups/guacamole-db.sql.gz https://raw.githubusercontent.com/EUD-cyber/eud-cyber/main/GUACVM02/backups/guacamole-db.sql.gz || rm -f /opt/guacamole/backups/guacamole-db.sql.gz

  - chmod +x /opt/guacamole/scripts/*.sh
  - chmod +x /opt/guacamole/nat.sh

  # Generate Guacamole PostgreSQL schema
  - docker run --rm guacamole/guacamole:1.6.0 /opt/guacamole/bin/initdb.sh --postgresql > /opt/guacamole/init/01-initdb.sql

  # Start DB and guacd first
  - docker compose -f /opt/guacamole/docker-compose.yml up -d postgres guacd

  - |
    for i in $(seq 1 60); do
      if docker compose -f /opt/guacamole/docker-compose.yml exec -T postgres \
          pg_isready -U guacamole_user -d guacamole_db >/dev/null 2>&1; then
        echo "PostgreSQL is ready."
        break
      fi
      sleep 2
    done

  - docker compose -f /opt/guacamole/docker-compose.yml up -d


  - |
    if [ -s /opt/guacamole/backups/guacamole-db.sql.gz ]; then
      /opt/guacamole/scripts/restore-guacamole-db.sh
    fi

  - systemctl daemon-reload
  - systemctl enable guac-nat
  - systemctl start guac-nat
  - netfilter-persistent save
  - printf '%s' 'Password1234!' > /opt/guacamole/portainer-admin-password
  - chmod 600 /opt/guacamole/portainer-admin-password

  - mkdir -p /opt/guacamole/nginx/certs
  - chmod +x /opt/guacamole/scripts/generate-https-certificate.sh
  - /opt/guacamole/scripts/generate-https-certificate.sh

  - docker compose -f /opt/guacamole/docker-compose.yml ps

power_state:
  mode: poweroff
  message: "Cyberlab v2 Guacamole installation finished - powering off"
  timeout: 30
  condition: true
